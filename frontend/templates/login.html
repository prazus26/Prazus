{% extends 'baseLoginCadastro.html' %}

{% block content_inicio %}
<main class="login_conteudo">
    <div class="conteudo">
        <h1>Login</h1>
        <form action="{{ url_for('login.realizar_login') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            <button type="submit">Login</button>
            <p>Não possui uma conta?<a href="/cadastrar">Criar Conta</a></p>
        </form>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
        <p class="{{ categoria }}">{{ mensagem }}</p>
        {% endfor %}
        {% endwith %}
    </div>
</main>
{% endblock %}
