<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prazus - Agenda Jurídica</title>

    <!-- CSS Próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuario.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Marcellus&display=swap" rel="stylesheet">

    <!-- FullCalendar v6 Scripts & CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/pt-br.global.min.js"></script>
</head>

<body>
    <!-- Topbar/Header -->
    <header>
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Prazus">
            <h1>PRAZUS</h1>
        </a>
        <div class="header-user">
            <span>Bem-vindo, Zitelli</span>
        </div>
    </header>

    <!-- Layout Principal com Flexbox (Sidebar + Conteúdo) -->
    <div class="app-layout">
        <!-- Sidebar Fixo -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="nav-link active">Calendario</a>
                <a href="#" class="nav-link">Publicados Hoje</a>
                <a href="#" class="nav-link">Notificações</a>
                <a href="#" class="nav-link">Minha conta</a>
                <a href="#" class="nav-link">Escala de cores</a>
            </nav>
        </aside>

        <!-- Conteúdo onde o template do Flask injeta as páginas -->
        <main class="main-content">
            {% block content_usuario %}
            <!-- A div do calendário deve estar na página que herda esse template ou aqui diretamente -->

            {% endblock %}
        </main>
    </div>

    <!-- JS Principal -->
    <script src="{{ url_for('static', filename='js/usuario.js') }}"></script>
</body>

</html>
